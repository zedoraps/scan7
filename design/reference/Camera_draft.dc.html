<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan7 · Camera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#38D6F5;text-decoration:none}a:hover{color:#8BE8FA}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #05090F; color: #EEF4FA; font-family: 'DM Mono', monospace; position: relative; overflow: hidden">

<div style="position: absolute; left: 0; top: 108px; width: 390px; height: 605px; overflow: hidden">
<img src="/_blob/c8dffff817d67c3174be471229fabd5a" alt="Live camera view of Mia's cards on a wooden floor" style="width: 390px; height: 605px; object-fit: cover; display: block">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="9">
<div style="position: absolute; left: {{b.x}}; top: {{b.y}}; width: {{b.w}}; height: {{b.h}}; box-sizing: border-box; border-radius: 10px; border: {{b.border}}; outline: {{b.outline}}">
<div style="position: absolute; left: -2px; top: -2px; padding: 3px 8px; border-radius: 9px 0 9px 0; background: {{b.tagBg}}; color: #0A1220; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: {{b.tagSize}}">{{b.label}}</div>
</div>
</sc-for>
<div style="position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: rgba(5, 9, 15, 0.78); font-size: 12px; white-space: nowrap">Fit the whole row in the frame</div>
</div>

<div style="position: absolute; left: 0; right: 0; top: 0; height: 108px; box-sizing: border-box; padding: 44px 16px 0; display: flex; align-items: center; gap: 12px; background: #0A1220">
<a href="SheetOpen.dc.html" aria-label="Close camera" style="width: 48px; height: 48px; border-radius: 14px; background: #15223A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF4FA" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div style="display: flex; align-items: center; gap: 10px; flex-grow: 1">
<div style="width: 26px; height: 35px; border-radius: 5px; background: #F2E3C4; transform: rotate(-8deg); display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 12px; color: #0A1220">M</div>
<div style="display: flex; flex-direction: column; gap: 1px">
<div style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #93A4BC">Scanning</div>
<div style="font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 16px">Mia</div>
</div>
</div>
<button aria-label="Torch" style="width: 48px; height: 48px; border-radius: 14px; border: none; background: #15223A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-1 5H9zM9 8h6v13H9zM12 12v3"></path></svg></button>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 131px; background: #0A1220; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 3px; width: 72px">
<div style="display: flex; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 4px; background: #38D6F5"></div><div style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 20px">9</div></div>
<div style="font-size: 12px; color: #93A4BC">cards seen</div>
</div>
<a href="Review.dc.html" aria-label="Capture" style="width: 84px; height: 84px; border-radius: 42px; border: 4px solid #EEF4FA; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><div style="width: 64px; height: 64px; border-radius: 32px; background: #38D6F5"></div></a>
<a href="Manual.dc.html" style="width: 72px; text-align: right; font-size: 12px; line-height: 1.4; color: #93A4BC">Type<br>instead</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const B = [['7',47,25,148,107],['8',58,138,148,102],['9',27,236,152,106],['10',25,342,153,113],['11',24,456,153,112],['+4',215,70,147,110],['×2',236,188,140,110],['+2',207,313,154,129],['+6',178,474,154,131]];
const boxes = B.map(([label,x,y,w,h]) => ({ label, x: x+'px', y: y+'px', w: w+'px', h: h+'px', border: '3px solid #38D6F5', outline: '1.5px solid #EEF4FA', tagBg: '#38D6F5', tagSize: '13px' }));
boxes.push({ label: 'IGNORED', x: '252px', y: '-6px', w: '140px', h: '68px', border: '2px dashed #C6D1DF', outline: 'none', tagBg: '#C6D1DF', tagSize: '9px' });
return { boxes };
}
}
</script>
</body>
</html>
