<div style="width: 390px; height: 844px; box-sizing: border-box; background: #05090F; color: #EEF4FA; font-family: 'DM Mono', monospace; position: relative; overflow: hidden">

<div style="background: #FF4F9A; color: #0A1220; padding: 22px 20px 18px; display: flex; align-items: center; justify-content: space-between; position: relative; overflow: hidden">
<div style="position: absolute; left: -20px; right: -20px; top: 52px; height: 3px; background: #0A1220; opacity: 0.18; transform: rotate(-8deg)"></div>

<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.02em; line-height: 1">BUST</div>
<div style="font-size: 14px; font-weight: 500">Two 7s in the row</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const n = (label, dot, dup) => ({ label, dot, line: dup ? '2.5px solid #FF4F9A' : '1.5px solid #2C4166', bg: dup ? '#3A1A35' : '#0A1220', ink: dup ? '#FF8FC0' : '#EEF4FA' });
return { cards: [n('3','#F08A8A'), n('7','#F2A0C0',true), n('12','#B8BFC9'), n('7','#F2A0C0',true), n('6','#C79BF2'), { label: '×2', dot: '#FFB561', line: '1.5px solid #6B4A1F', bg: '#0A1220', ink: '#FFB561' }] };
}
}
</script>
