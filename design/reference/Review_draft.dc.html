<!doctype html>

<x-dc>

<style>
body{margin:0}
a{color:#38D6F5;text-decoration:none}a:hover{color:#8BE8FA}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #05090F; color: #EEF4FA; font-family: 'DM Mono', monospace; position: relative; overflow: hidden">

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 605px; overflow: hidden">

</sc-for>
</div>

<div style="position: absolute; left: 16px; top: 44px">

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #15223A; border-radius: 30px 30px 0 0; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -20px 40px rgba(0,0,0,0.45)">
<div style="display: flex; align-items: flex-start; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 30px; height: 40px; border-radius: 6px; background: #F2E3C4; transform: rotate(-8deg); display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 14px; color: #0A1220">M</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 17px">Mia</div>
<div style="font-size: 12px; color: #93A4BC">Round 4 · 96 → 198</div>
</div>
</div>
<div style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 52px; line-height: 0.9; color: #38D6F5; letter-spacing: -0.03em">102</div>
</div>

<div style="font-size: 13px; line-height: 1.6; color: #C6D1DF">7+8+9+10+11 = 45 <span style="color: #5D7193">·</span> ×2 = 90 <span style="color: #5D7193">·</span> +4 +2 +6 = <span style="color: #EEF4FA; font-weight: 500">102</span></div>

<sc-for list="{{cards}}" as="c" hint-placeholder-count="10">
<div style="height: 44px; min-width: 38px; box-sizing: border-box; padding: 0 10px; border-radius: 9px; border: {{c.line}}; background: #0A1220; display: flex; align-items: center; justify-content: center; position: relative; font-family: {{c.font}}; font-weight: 600; font-size: {{c.size}}; color: {{c.ink}}"><div style="position: absolute; left: 5px; top: 5px; width: 6px; height: 6px; border-radius: 3px; background: {{c.dot}}"></div>{{c.label}}</div>

</div>

<div style="display: flex; gap: 10px; margin-top: 2px">
<a href="Camera.dc.html" aria-label="Retake" style="width: 64px; height: 64px; border-radius: 18px; border: 1.5px solid #2C4166; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EEF4FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"></path></svg></a>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const B = [['7',47,25,148,107],['8',58,138,148,102],['9',27,236,152,106],['10',25,342,153,113],['11',24,456,153,112],['+4',215,70,147,110],['×2',236,188,140,110],['+2',207,313,154,129],['+6',178,474,154,131]];
const boxes = B.map(([label,x,y,w,h]) => ({ label, x: x+'px', y: y+'px', w: w+'px', h: h+'px', border: '3px solid #38D6F5', outline: '1.5px solid #EEF4FA', tagBg: '#38D6F5', tagSize: '12px' }));
boxes.push({ label: 'IGNORED', x: '252px', y: '-6px', w: '140px', h: '68px', border: '2px dashed #C6D1DF', outline: 'none', tagBg: '#C6D1DF', tagSize: '9px' });
const dots = { '7': '#F2A0C0', '8': '#A6E38A', '9': '#F2B36B', '10': '#E86F6F', '11': '#79A8F2' };
const num = (n) => ({ label: n, dot: dots[n], line: '1.5px solid #2C4166', ink: '#EEF4FA', font: "'Unbounded', sans-serif", size: '15px' });
const mod = (n) => ({ label: n, dot: '#FFB561', line: '1.5px solid #6B4A1F', ink: '#FFB561', font: "'Unbounded', sans-serif", size: '15px' });
return { boxes, cards: ['7','8','9','10','11'].map(num).concat(['×2','+4','+2','+6'].map(mod)).concat([{ label: '2nd chance · ignored', dot: 'transparent', line: '1.5px dashed #3A5075', ink: '#93A4BC', font: "'DM Mono', monospace", size: '12px' }]) };
}
}
</script>
</body>
