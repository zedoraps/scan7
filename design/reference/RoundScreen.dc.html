<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan7 · Round screen, table and list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#38D6F5;text-decoration:none}a:hover{color:#8BE8FA}
button{font:inherit;cursor:pointer}
@keyframes s7wiggle{0%{transform:rotate(-1.6deg)}100%{transform:rotate(1.6deg)}}
</style>
</helmet>
<div data-stage="1" style="width: 390px; height: 844px; box-sizing: border-box; background: #0A1220; color: #EEF4FA; font-family: 'DM Mono', monospace; position: relative; overflow: hidden; user-select: none">

<sc-if value="{{normalHeader}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 16px; right: 16px; top: 48px; height: 48px; display: flex; align-items: center; justify-content: space-between">
<svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#38D6F5"></rect><g transform="rotate(-8 50 50)"><rect x="30" y="20" width="40" height="60" rx="7" fill="#0A1220"></rect><path d="M42 35h16l-9 25" fill="none" stroke="#38D6F5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path><rect x="12" y="66" width="76" height="10" rx="5" fill="#EEF4FA" stroke="#0A1220" stroke-width="2.5"></rect></g></svg>
<div role="group" aria-label="Layout" style="display: flex; padding: 4px; gap: 4px; border-radius: 14px; background: #15223A">
<button aria-label="Table view" aria-pressed="{{isTable}}" onClick="{{toTable}}" style="width: 56px; height: 40px; border-radius: 10px; border: none; background: {{tabBg}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{tabInk}}" stroke-width="2" aria-hidden="true"><rect x="9" y="2.5" width="6" height="4" rx="1"></rect><rect x="9" y="17.5" width="6" height="4" rx="1"></rect><rect x="2" y="10" width="5" height="4" rx="1"></rect><rect x="17" y="10" width="5" height="4" rx="1"></rect></svg></button>
<button aria-label="List view" aria-pressed="{{isList}}" onClick="{{toList}}" style="width: 56px; height: 40px; border-radius: 10px; border: none; background: {{lisBg}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{lisInk}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
</div>
<div style="display: flex; gap: 8px">
<button aria-label="Arrange seats" onClick="{{startArrange}}" style="width: 48px; height: 48px; border-radius: 12px; border: none; background: #15223A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"></path></svg></button>
<button aria-label="Reset demo" onClick="{{resetDemo}}" style="width: 48px; height: 48px; border-radius: 12px; border: none; background: #15223A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#EEF4FA" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg></button>
</div>
</div>
</sc-if>
<sc-if value="{{arrange}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 16px; right: 16px; top: 48px; height: 48px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 16px">Arrange seats</div>
<div style="font-size: 12px; color: #93A4BC">{{arrangeHint}}</div>
</div>
<button onClick="{{endArrange}}" style="height: 48px; padding: 0 24px; border-radius: 12px; border: none; background: #38D6F5; color: #0A1220; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 15px">Done</button>
</div>
</sc-if>

<sc-if value="{{isTable}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 95px; top: 348px; width: 200px; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; pointer-events: none; opacity: {{midOp}}">
<div style="font-size: 11px; letter-spacing: 0.24em; color: #93A4BC">ROUND</div>
<div style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 72px; line-height: 0.85; letter-spacing: -0.04em">4</div>
</div>
<sc-for list="{{seats}}" as="s" hint-placeholder-count="4">
<div onPointerDown="{{s.down}}" onPointerMove="{{s.move}}" onPointerUp="{{s.up}}" onPointerCancel="{{s.cancel}}" style="position: absolute; left: {{s.left}}; top: {{s.top}}; width: {{sz.w}}; height: {{sz.h}}; z-index: {{s.z}}; transition: {{s.anim}}; touch-action: {{touch}}">
<div style="width: 100%; height: 100%; box-sizing: border-box; border-radius: {{sz.radius}}; border: {{s.border}}; background: {{s.bg}}; padding: {{sz.pad}}; display: flex; flex-direction: column; gap: 6px; transform: {{s.lift}}; box-shadow: {{s.shadow}}; animation: {{s.wiggle}}; position: relative">
<sc-if value="{{s.lead}}" hint-placeholder-val="{{false}}"><div style="position: absolute; right: -6px; top: -6px; width: 24px; height: 24px; border-radius: 12px; background: #EEF4FA; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#0A1220" aria-hidden="true"><path d="M3 18h18l-1.5-10-5 4L12 5l-2.5 7-5-4z"></path></svg></div></sc-if>
<button aria-label="{{s.aria}}" onClick="{{s.tap}}" style="flex-grow: 1; border: none; background: transparent; color: {{s.ink}}; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: {{cursor}}">
<div style="position: relative; width: {{sz.ring}}; height: {{sz.ring}}; flex-shrink: 0; opacity: {{s.dim}}">
<svg width="{{sz.ringN}}" height="{{sz.ringN}}" viewBox="0 0 100 100" style="position: absolute; inset: 0" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="none" stroke="#22324F" stroke-width="7"></circle><circle cx="50" cy="50" r="45" fill="none" stroke="{{s.color}}" stroke-width="7" stroke-linecap="round" stroke-dasharray="{{s.dash}}" transform="rotate(-90 50 50)"></circle></svg>
<div style="position: absolute; left: 50%; top: 50%; width: {{sz.tokW}}; height: {{sz.tokH}}; margin-left: {{sz.tokML}}; margin-top: {{sz.tokMT}}; border-radius: 5px; background: {{s.color}}; transform: rotate(-8deg); display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: {{sz.tokF}}; color: #0A1220">{{s.initial}}</div>
</div>
<div style="display: flex; align-items: baseline; justify-content: center; gap: 6px; width: 100%; white-space: nowrap; overflow: hidden">
<span style="font-size: {{sz.nameF}}">{{s.name}}</span><span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: {{sz.totF}}">{{s.total}}</span>
</div>
</button>
<sc-if value="{{s.showActions}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<button aria-label="{{s.scanLabel}}" onClick="{{s.scan}}" style="height: {{sz.actH}}; border-radius: 8px; border: none; background: #38D6F5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A1220" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M4 12h16"></path></svg></button>
<button aria-label="{{s.bustLabel}}" onClick="{{s.bust}}" style="height: {{sz.actH}}; border-radius: 8px; border: 1.5px solid #FF4F9A; background: transparent; display: flex; align-items: center; justify-content: center; color: #FF4F9A; font-size: 10px; font-weight: 500; letter-spacing: 0.06em">BUST</button>
</div>
</sc-if>
<sc-if value="{{s.showTag}}" hint-placeholder-val="{{false}}">
<div style="height: {{sz.tagH}}; border-radius: 6px; background: {{s.tagBg}}; color: {{s.tagInk}}; border: {{s.tagLine}}; box-sizing: border-box; font-size: {{sz.tagF}}; font-weight: 500; letter-spacing: 0.06em; display: flex; align-items: center; justify-content: center; white-space: nowrap">{{s.tag}}</div>
</sc-if>
</div>
</div>
</sc-for>
</sc-if>

<sc-if value="{{isList}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 16px; right: 16px; top: 112px; height: 40px; display: flex; align-items: baseline; gap: 10px">
<div style="font-size: 11px; letter-spacing: 0.24em; color: #93A4BC">ROUND</div>
<div style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 32px; line-height: 1">4</div>
</div>
<sc-for list="{{rows}}" as="s" hint-placeholder-count="4">
<div onPointerDown="{{s.down}}" onPointerMove="{{s.move}}" onPointerUp="{{s.up}}" onPointerCancel="{{s.cancel}}" style="position: absolute; left: 16px; top: {{s.top}}; width: 358px; height: {{ls.h}}; z-index: {{s.z}}; transition: {{s.anim}}; touch-action: {{touch}}">
<div style="width: 100%; height: 100%; box-sizing: border-box; border-radius: {{ls.radius}}; border: {{s.border}}; background: {{s.bg}}; padding: 0 8px 0 0; display: grid; grid-template-columns: minmax(0, 1fr) {{ls.actW}}; column-gap: 8px; align-items: center; transform: {{s.lift}}; box-shadow: {{s.shadow}}; animation: {{s.wiggle}}">
<button aria-label="{{s.aria}}" onClick="{{s.tap}}" style="height: 100%; border: none; background: transparent; color: {{s.ink}}; padding: 0 0 0 12px; display: grid; grid-template-columns: {{ls.cols}}; column-gap: 12px; align-items: center; text-align: left; cursor: {{cursor}}">
<div style="position: relative; width: {{ls.ring}}; height: {{ls.ring}}; opacity: {{s.dim}}">
<svg width="{{ls.ringN}}" height="{{ls.ringN}}" viewBox="0 0 100 100" style="position: absolute; inset: 0" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="none" stroke="#22324F" stroke-width="7"></circle><circle cx="50" cy="50" r="45" fill="none" stroke="{{s.color}}" stroke-width="7" stroke-linecap="round" stroke-dasharray="{{s.dash}}" transform="rotate(-90 50 50)"></circle></svg>
<div style="position: absolute; left: 50%; top: 50%; width: {{ls.tokW}}; height: {{ls.tokH}}; margin-left: {{ls.tokML}}; margin-top: {{ls.tokMT}}; border-radius: 5px; background: {{s.color}}; transform: rotate(-8deg); display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: {{ls.tokF}}; color: #0A1220">{{s.initial}}</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<div style="font-size: {{ls.nameF}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</div>
<sc-if value="{{s.lead}}" hint-placeholder-val="{{false}}"><div style="width: 20px; height: 20px; border-radius: 10px; background: #EEF4FA; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="#0A1220" aria-hidden="true"><path d="M3 18h18l-1.5-10-5 4L12 5l-2.5 7-5-4z"></path></svg></div></sc-if>
</div>
<div style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: {{ls.totF}}; text-align: right">{{s.total}}</div>
</button>
<sc-if value="{{s.showActions}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<button aria-label="{{s.scanLabel}}" onClick="{{s.scan}}" style="height: {{ls.actH}}; border-radius: 10px; border: none; background: #38D6F5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A1220" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M4 12h16"></path></svg></button>
<button aria-label="{{s.bustLabel}}" onClick="{{s.bust}}" style="height: {{ls.actH}}; border-radius: 10px; border: 1.5px solid #FF4F9A; background: transparent; color: #FF4F9A; font-size: 10px; font-weight: 500; letter-spacing: 0.06em">BUST</button>
</div>
</sc-if>
<sc-if value="{{s.showTag}}" hint-placeholder-val="{{false}}">
<div style="height: 28px; border-radius: 8px; background: {{s.tagBg}}; color: {{s.tagInk}}; border: {{s.tagLine}}; box-sizing: border-box; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; display: flex; align-items: center; justify-content: center; white-space: nowrap">{{s.tag}}</div>
</sc-if>
</div>
</div>
</sc-for>
</sc-if>

<div style="position: absolute; left: 16px; right: 16px; top: 720px; height: 24px; display: flex; align-items: center; justify-content: space-between; opacity: {{midOp}}">
<div style="display: flex; gap: 4px" aria-hidden="true">
<sc-for list="{{bar}}" as="b" hint-placeholder-count="4"><div style="width: {{b.w}}; height: 8px; border-radius: 2px; background: {{b.bg}}; border: {{b.line}}; box-sizing: border-box; transform: skewX(-20deg)"></div></sc-for>
</div>
<div style="font-size: 12px; color: #93A4BC">{{scoredText}} · to 200</div>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 64px; display: grid; grid-template-columns: {{bottomCols}}; gap: 8px; opacity: {{bottomOp}}">
<sc-if value="{{hasNext}}" hint-placeholder-val="{{true}}">
<button onClick="{{closeRound}}" style="height: 64px; border-radius: 16px; border: 1.5px solid #2C4166; background: transparent; color: #EEF4FA; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 12px; line-height: 1.3">Close<br>round</button>
<button onClick="{{scanNext}}" style="height: 64px; border-radius: 16px; border: none; background: #38D6F5; color: #0A1220; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 20px">
<span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px"><span style="font-size: 11px; letter-spacing: 0.14em">SCAN NEXT</span><span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 18px">{{nextName}}</span></span>
<span style="width: 32px; height: 42px; border-radius: 6px; background: {{nextColor}}; transform: rotate(-8deg); display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 14px; color: #0A1220; border: 2px solid #0A1220">{{nextInitial}}</span>
</button>
</sc-if>
<sc-if value="{{allDone}}" hint-placeholder-val="{{false}}">
<button onClick="{{closeRound}}" style="height: 64px; border-radius: 16px; border: none; background: #38D6F5; color: #0A1220; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 16px">Close round</button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"count":{"editor":"enum","options":["3","4","6","10"],"default":"4"},"view":{"editor":"enum","options":["table","list"],"default":"table"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { order: null, pos: null, posN: 0, drag: null, view: null, arrange: false, st: {} };
this.timer = null;
}
componentWillUnmount() { if (this.timer) clearTimeout(this.timer); }
renderVals() {
const n = parseInt(this.props.count ?? '4', 10) || 4;
const view = this.state.view || this.props.view || 'table';
const isTable = view === 'table';
const arrange = this.state.arrange;
const ALL = [
{ id: 'P', name: 'Philip', color: '#FFC24B', total: 142, s: 'scored', r: 46 },
{ id: 'A', name: 'Anna', color: '#B39BFF', total: 118, s: 'bust' },
{ id: 'B', name: 'Ben', color: '#A8E55C', total: 167, s: 'open', r: 28 },
{ id: 'M', name: 'Mia', color: '#F2E3C4', total: 96, s: 'open', r: 102 },
{ id: 'L', name: 'Lena', color: '#7FA8FF', total: 131, s: 'scored', r: 22 },
{ id: 'T', name: 'Tom', color: '#4FE0A8', total: 74, s: 'open', r: 35 },
{ id: 'N', name: 'Noah', color: '#C9B28A', total: 158, s: 'scored', r: 31 },
{ id: 'Z', name: 'Zoe', color: '#FF9C8A', total: 102, s: 'bust' },
{ id: 'E', name: 'Elias', color: '#A9B8CC', total: 88, s: 'open', r: 19 },
{ id: 'S', name: 'Sara', color: '#E2F06B', total: 120, s: 'scored', r: 18 }
];
const st = this.state.st;
const people = ALL.slice(0, n).map((p) => ({ ...p, initial: p.name[0], s: st[p.id] || p.s }));
const leadId = people.reduce((a, b) => (b.total > a.total ? b : a)).id;
const order = this.state.order && this.state.order.length === n ? this.state.order : people.map((p) => p.id);
const C = Math.PI * 90;
const setS = (id, v) => this.setState({ st: { ...this.state.st, [id]: v } });
const local = (e) => { const r = e.currentTarget.closest('[data-stage]').getBoundingClientRect(); const k = r.width / 390; return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k }; };
const common = (p, dragging, i) => {
const done = p.s !== 'open';
return {
done, showActions: !done && !arrange, showTag: done || arrange,
tag: p.s === 'scored' ? '✓ +' + (p.r || 0) : (p.s === 'bust' ? '✕ BUST' : 'OPEN'),
tagBg: p.s === 'scored' ? '#12384A' : (p.s === 'bust' ? '#FF4F9A' : 'transparent'),
tagInk: p.s === 'scored' ? '#38D6F5' : (p.s === 'bust' ? '#0A1220' : '#93A4BC'),
tagLine: p.s === 'open' ? '1.5px dashed #3A5075' : 'none',
bg: done ? '#0D1626' : '#15223A', ink: done ? '#7F90A8' : '#EEF4FA', dim: done ? 0.45 : 1,
lead: p.id === leadId, dash: (C * Math.min(1, p.total / 200)).toFixed(1) + ' 999',
z: dragging ? 5 : 1, anim: dragging ? 'none' : 'left 220ms ease-out, top 220ms ease-out',
border: dragging ? '2px solid #38D6F5' : (arrange ? '1.5px dashed #3A5075' : (done ? '1.5px solid #131F33' : '1.5px solid #2C4166')),
lift: dragging ? 'scale(1.06)' : 'none',
shadow: dragging ? '0 18px 30px rgba(0,0,0,0.55)' : (done ? 'none' : '0 8px 18px rgba(0,0,0,0.35)'),
wiggle: arrange && !dragging ? 's7wiggle ' + (0.22 + (i % 3) * 0.03) + 's ease-in-out ' + (-(i * 0.07)) + 's infinite alternate' : 'none',
aria: p.name + ', ' + p.total + ' points, ' + (done ? (p.s === 'bust' ? 'bust' : 'scored') : 'not scored yet') + '. Long-press to arrange.',
scanLabel: 'Scan ' + p.name, bustLabel: 'Mark ' + p.name + ' as bust',
scan: () => setS(p.id, 'scored'), bust: () => setS(p.id, 'bust'),
tap: () => { if (!arrange && done) setS(p.id, 'open'); }
};
};
const clearTimer = () => { if (this.timer) { clearTimeout(this.timer); this.timer = null; } };
const pressStart = (e, begin) => {
if (this.state.arrange) { if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); begin(); return; }
clearTimer();
const el = e.currentTarget, pid = e.pointerId;
this.timer = setTimeout(() => { this.timer = null; if (el.setPointerCapture) { try { el.setPointerCapture(pid); } catch (x) {} } this.setState({ arrange: true }); begin(); }, 450);
};

// TABLE
const big = n <= 4, mid = n > 4 && n <= 6;
const W = big ? 112 : (mid ? 96 : 72), H = big ? 140 : (mid ? 124 : 96);
const ring = big ? 56 : (mid ? 46 : 36);
const tok = big ? [24, 32, 12] : (mid ? [20, 27, 11] : [16, 21, 9]);
const sz = { w: W + 'px', h: H + 'px', radius: big ? '18px' : '14px', pad: big ? '8px' : '6px',
ring: ring + 'px', ringN: ring, tokW: tok[0] + 'px', tokH: tok[1] + 'px', tokML: (-tok[0] / 2) + 'px', tokMT: (-tok[1] / 2) + 'px', tokF: tok[2] + 'px',
nameF: big ? '12px' : '11px', totF: big ? '17px' : (mid ? '15px' : '13px'), tagH: big ? '30px' : (mid ? '26px' : '20px'), tagF: big ? '11px' : '10px',
actH: big ? '36px' : '30px' };
const TOP = 112, BOT = 704, CX = 195, CY = (TOP + BOT) / 2;
const RX = 195 - W / 2 - 12, RY = (BOT - TOP) / 2 - H / 2;
const defaultPos = {};
order.forEach((id, i) => { const a = (-90 + i * 360 / n) * Math.PI / 180; defaultPos[id] = { x: CX + RX * Math.cos(a) - W / 2, y: CY + RY * Math.sin(a) - H / 2 }; });
const pos = this.state.pos && this.state.posN === n ? this.state.pos : defaultPos;
const clampX = (x) => Math.max(8, Math.min(390 - W - 8, x));
const clampY = (y) => Math.max(TOP, Math.min(BOT - H, y));
const seats = people.map((p, i) => {
const dragging = !!(this.state.drag && this.state.drag.id === p.id);
const q = dragging ? this.state.drag : pos[p.id];
const c = common(p, dragging, i);
if (!big && !mid) { c.showActions = false; c.showTag = true; }
return { ...p, ...c, left: q.x + 'px', top: q.y + 'px',
down: (e) => { const l = local(e); const at = pos[p.id]; pressStart(e, () => this.setState({ pos, posN: n, drag: { id: p.id, x: at.x, y: at.y, ox: l.x - at.x, oy: l.y - at.y } })); },
move: (e) => { const d = this.state.drag; if (!d || d.id !== p.id) return; const l = local(e); this.setState({ drag: { ...d, x: clampX(l.x - d.ox), y: clampY(l.y - d.oy) } }); },
up: () => { clearTimer(); const d = this.state.drag; if (!d || d.id !== p.id) return; this.setState({ pos: { ...pos, [p.id]: { x: d.x, y: d.y } }, posN: n, drag: null }); },
cancel: () => { clearTimer(); this.setState({ drag: null }); }
};
});

// LIST
const compact = n > 6;
const RH = compact ? 48 : 72, GAP = compact ? 6 : 8, LTOP = 168;
const lr = compact ? 32 : 48;
const ltok = compact ? [15, 20, 9] : [22, 30, 11];
const ls = { h: RH + 'px', radius: compact ? '14px' : '18px', ring: lr + 'px', ringN: lr,
cols: lr + 'px minmax(0, 1fr) ' + (compact ? '52px' : '64px'), actW: compact ? '108px' : '116px', actH: compact ? '36px' : '48px',
tokW: ltok[0] + 'px', tokH: ltok[1] + 'px', tokML: (-ltok[0] / 2) + 'px', tokMT: (-ltok[1] / 2) + 'px', tokF: ltok[2] + 'px',
nameF: compact ? '14px' : '15px', totF: compact ? '18px' : '24px' };
const swap = (id, to) => { const from = order.indexOf(id); const next = order.slice(); const other = next[to]; next[to] = id; next[from] = other; this.setState({ order: next, drag: null }); };
const rows = people.map((p, i) => {
const idx = order.indexOf(p.id);
const dragging = !!(this.state.drag && this.state.drag.id === p.id);
const home = LTOP + idx * (RH + GAP);
const y = dragging ? this.state.drag.y : home;
return { ...p, ...common(p, dragging, i), top: y + 'px',
down: (e) => { const l = local(e); pressStart(e, () => this.setState({ order, drag: { id: p.id, y: home, oy: l.y - home } })); },
move: (e) => { const d = this.state.drag; if (!d || d.id !== p.id) return; const l = local(e); this.setState({ drag: { ...d, y: Math.max(LTOP - 20, Math.min(LTOP + (n - 1) * (RH + GAP) + 20, l.y - d.oy)) } }); },
up: () => { clearTimer(); const d = this.state.drag; if (!d || d.id !== p.id) return; swap(p.id, Math.max(0, Math.min(n - 1, Math.round((d.y - LTOP) / (RH + GAP))))); },
cancel: () => { clearTimer(); this.setState({ drag: null }); }
};
});

const scored = people.filter((p) => p.s !== 'open').length;
const nextId = order.find((id) => people.find((q) => q.id === id).s === 'open');
const next = nextId ? people.find((q) => q.id === nextId) : null;
const bw = Math.max(8, Math.min(24, Math.floor(120 / n)));
const bar = order.map((id) => { const p = people.find((q) => q.id === id); return {
w: bw + 'px', bg: p.s === 'scored' ? p.color : (p.s === 'bust' ? '#FF4F9A' : 'transparent'), line: p.s === 'open' ? '1.5px solid #3A5075' : 'none' }; });
return {
isTable, isList: !isTable, arrange, normalHeader: !arrange,
arrangeHint: isTable ? 'Drag players to where they sit' : 'Drag rows into seating order',
seats, rows, sz, ls, bar, scoredText: scored + ' of ' + n + ' scored',
touch: arrange ? 'none' : 'manipulation', cursor: arrange ? 'grab' : 'pointer',
midOp: arrange ? 0.25 : 1, bottomOp: arrange ? 0.25 : 1,
hasNext: !!next, allDone: !next, bottomCols: next ? '88px minmax(0, 1fr)' : 'minmax(0, 1fr)',
nextName: next ? next.name : '', nextInitial: next ? next.initial : '', nextColor: next ? next.color : '#EEF4FA',
scanNext: () => { if (next) setS(next.id, 'scored'); },
closeRound: () => {},
resetDemo: () => this.setState({ st: {} }),
tabBg: isTable ? '#38D6F5' : 'transparent', tabInk: isTable ? '#0A1220' : '#93A4BC',
lisBg: isTable ? 'transparent' : '#38D6F5', lisInk: isTable ? '#93A4BC' : '#0A1220',
toTable: () => this.setState({ view: 'table', drag: null }), toList: () => this.setState({ view: 'list', drag: null }),
startArrange: () => this.setState({ arrange: true }), endArrange: () => this.setState({ arrange: false, drag: null })
};
}
}
</script>
