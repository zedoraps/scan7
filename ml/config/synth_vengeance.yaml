# Synthetic data for Flip 7: With a Vengeance (scripts/gen_synth.py --config config/synth_vengeance.yaml).
# Everything not set here comes from synth.yaml; a section set here replaces that whole section.
base: synth.yaml

cards_config: config/cards_vengeance.yaml   # class list (28 Vengeance classes)
out: out/synth_vengeance                     # default output dir (never the Flip 7 out/synth)

# Cutout dirs, relative to ml/ (scripts/make_cutouts.py --config config/cards_vengeance.yaml).
# Vengeance looks only: the Flip 7 cutouts (out/cutouts) are deliberately not used, this is a
# separate Vengeance model.
cutouts:
  - dir: out/cutouts_vengeance
    # Banner word area on Vengeance number cards 1-13: inside the inner yellow frame line of all of
    # them (measured on the cutouts: 01-09 inner frame y 0.733-0.827, 10-13 y 0.725-0.820; the
    # words span y 0.745-0.814). Flip 7's text.inner (0.768-0.838) would sit too low.
    text_inner: [0.055, 0.733, 0.945, 0.820]

# Flip 7's look weights (English 0 / back / Second Chance) don't apply here.
variants: {}
